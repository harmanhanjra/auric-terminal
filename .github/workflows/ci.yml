name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q server.py engine.py execution_v2.py production_control.py multi_engine.py brain_agent.py kronos_engine.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Backend tests
        run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build production container
        run: docker build -t auric-terminal:ci .
